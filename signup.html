<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Ozone Amanzi</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            background: url('https://images.pexels.com/photos/1000084/pexels-photo-1000084.jpeg') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 15, 30, 0.85), rgba(0, 0, 0, 0.85));
            z-index: -1;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 6px;
        }
        h2 i {
            color: #00e676;
        }
        .subtitle {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.85;
            margin-bottom: 4px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
        }
        input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        input:focus {
            border-color: #00e676;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.15);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 200, 83, 0.35);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.6;
        }
        .link a {
            color: #00e676;
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff6b6b;
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            z-index: 999;
            font-size: 15px;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: #00c853;
        }


        .password-hint {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
            padding-left: 4px;
        }
        .password-hint i {
            margin-right: 4px;
        }
        .password-hint.valid {
            color: #00e676;
            opacity: 1;
        }
        .password-hint.invalid {
            color: #ff6b6b;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fas fa-user-plus"></i> Create Account</h2>
        <p class="subtitle">Join Ozone Amanzi for a cleaner future</p>

        <form id="signupForm" onsubmit="signupUser(event)">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signupName" placeholder="John Doe" required />
                </div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signupEmail" placeholder="john@example.com" required />
                </div>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="signupPhone" placeholder="081 234 5678" required />
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    
                    <input type="password" id="signupPassword" placeholder="Min 8 chars & 2 special" required />
                </div>
               
                <div id="passwordHints">
                    <div class="password-hint" id="hintLength">
                        <i class="fas fa-circle"></i> At least 8 characters
                    </div>
                    <div class="password-hint" id="hintSpecial">
                        <i class="fas fa-circle"></i> At least 2 special characters (e.g., !@#$%^&*)
                    </div>
                </div>
            </div>
            <button type="submit" class="btn" id="signupBtn">Create Account</button>
        </form>

        <div class="error-msg" id="signupError"></div>

        <div class="link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
        <div class="link" style="margin-top:6px;">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

   <script>

    // ===== TOAST FUNCTION =====
    let toastTimeout = null;

    function showToast(message, isSuccess = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show' + (isSuccess ? ' success' : '');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // ===== PASSWORD VALIDATION =====
    document.getElementById('signupPassword').addEventListener('input', function() {
        const password = this.value;
        const minLength = 8;
        const specialCharRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/g;
        const specialCount = (password.match(specialCharRegex) || []).length;

        const hintLength = document.getElementById('hintLength');
        const hintSpecial = document.getElementById('hintSpecial');

        if (password.length >= minLength) {
            hintLength.className = 'password-hint valid';
            hintLength.innerHTML = '<i class="fas fa-check-circle"></i> At least 8 characters';
        } else {
            hintLength.className = 'password-hint invalid';
            hintLength.innerHTML = '<i class="fas fa-circle"></i> At least 8 characters';
        }

        if (specialCount >= 2) {
            hintSpecial.className = 'password-hint valid';
            hintSpecial.innerHTML = '<i class="fas fa-check-circle"></i> At least 2 special characters (e.g., !@#$%^&*)';
        } else {
            hintSpecial.className = 'password-hint invalid';
            hintSpecial.innerHTML = '<i class="fas fa-circle"></i> At least 2 special characters (e.g., !@#$%^&*)';
        }
    });

    // ===== SIGNUP FUNCTION =====
    window.signupUser = function(e) {
        e.preventDefault();

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const phone = document.getElementById("signupPhone").value.trim();
        const password = document.getElementById("signupPassword").value;

        const btn = document.getElementById("signupBtn");
        const errorMsg = document.getElementById("signupError");

        errorMsg.classList.remove("show");
        errorMsg.textContent = "";

        // Validate name
        if (name.length < 2) {
            errorMsg.textContent = "Enter your full name.";
            errorMsg.classList.add("show");
            return;
        }

        // Validate email
        if (!email.includes("@")) {
            errorMsg.textContent = "Enter a valid email.";
            errorMsg.classList.add("show");
            return;
        }

        // Validate phone
        if (phone.length < 10) {
            errorMsg.textContent = "Enter a valid phone number.";
            errorMsg.classList.add("show");
            return;
        }

        // Validate password
        const specialCharRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/g;
        const specialCount = (password.match(specialCharRegex) || []).length;

        if (password.length < 8) {
            errorMsg.textContent = "Password must be at least 8 characters.";
            errorMsg.classList.add("show");
            return;
        }

        if (specialCount < 2) {
            errorMsg.textContent = "Password must contain at least 2 special characters.";
            errorMsg.classList.add("show");
            return;
        }

        // Disable button
        btn.disabled = true;
        btn.innerHTML = "Creating Account...";

        // CREATE FIREBASE AUTH ACCOUNT
        firebase.auth()
            .createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                console.log("Firebase Authentication account created!");
                console.log("UID:", user.uid);

                // SAVE USER INFORMATION TO REALTIME DATABASE
                return firebase.database()
                    .ref("users/" + user.uid)
                    .set({
                        uid: user.uid,
                        name: name,
                        email: email,
                        phone: phone,
                        role: "customer",
                        createdAt: new Date().toISOString()
                    });
            })
            .then(() => {
                console.log("User information saved to Realtime Database.");
                showToast("Account created successfully!", true);

                setTimeout(() => {
                    window.location.href = "product.html";
                }, 1000);
            })
            .catch((error) => {
                console.error("Firebase Error:", error);
                btn.disabled = false;
                btn.innerHTML = "Create Account";

                let message = "Something went wrong. Please try again.";

                if (error.code === "auth/email-already-in-use") {
                    message = "This email is already registered.";
                } else if (error.code === "auth/invalid-email") {
                    message = "Please enter a valid email address.";
                } else if (error.code === "auth/weak-password") {
                    message = "The password is too weak.";
                } else if (error.code === "PERMISSION_DENIED") {
                    message = "Database permission denied. Check your Firebase Database Rules.";
                } else if (error.message) {
                    message = error.message;
                }

                errorMsg.textContent = message;
                errorMsg.classList.add("show");
            });
    };
</script>
