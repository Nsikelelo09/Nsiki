<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ozone Amanzi</title>

    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: url('https://images.pexels.com/photos/1000084/pexels-photo-1000084.jpeg') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 15, 30, 0.85), rgba(0, 0, 0, 0.85));
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 6px;
        }

        h2 i {
            color: #00e676;
        }

        .subtitle {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input:focus {
            border-color: #00e676;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 200, 83, 0.35);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.6;
        }

        .link a {
            color: #00e676;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

      
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff6b6b;
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            z-index: 999;
            font-size: 15px;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #00c853;
        }

        /* ===== Here it should remember the user (Nsikelelo) ===== */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0 16px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00c853;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            opacity: 0.7;
            cursor: pointer;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }
            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2><i class="fas fa-droplet"></i> Welcome Back</h2>
        <p class="subtitle">Login to continue your order</p>

        <form id="loginForm" onsubmit="loginUser(event)">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="john@example.com" required />
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required />
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" checked />
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="error-msg" id="loginError">Invalid email or password</div>

        <div class="link">
            Don't have an account? <a href="signup.html">Create one here</a>
        </div>
        <div class="link" style="margin-top:6px;">
            <a href="product.html"><i class="fas fa-arrow-left"></i> Back to products</a>
        </div>
    </div>

   
    <div class="toast" id="toast"></div>

<script>
    // ==============================
    // FIREBASE AUTH PERSISTENCE
    // ==============================

    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .then(() => {
            console.log("✅ Firebase login persistence enabled.");
        })
        .catch((error) => {
            console.error("❌ Persistence error:", error);
        });


    // ==============================
    // TOAST
    // ==============================

    let toastTimeout = null;

    function showToast(message, isSuccess = false) {

        const toast = document.getElementById('toast');

        toast.textContent = message;

        toast.className =
            'toast show' + (isSuccess ? ' success' : '');

        if (toastTimeout) {
            clearTimeout(toastTimeout);
        }

        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000);
    }


    // ==============================
    // LOGIN
    // ==============================

    function loginUser(e) {

        e.preventDefault();

        const email =
            document.getElementById('loginEmail').value.trim();

        const password =
            document.getElementById('loginPassword').value;

        const errorMsg =
            document.getElementById('loginError');

        const btn =
            document.getElementById('loginBtn');


        errorMsg.classList.remove('show');
        errorMsg.textContent = '';


        if (!email || !password) {

            errorMsg.textContent =
                'Please enter both email and password.';

            errorMsg.classList.add('show');

            return;
        }


        btn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Logging in...';

        btn.disabled = true;


        // ==============================
        // FIREBASE LOGIN
        // ==============================

        firebase.auth()

            .signInWithEmailAndPassword(
                email,
                password
            )

            .then((userCredential) => {

                const user = userCredential.user;

                console.log(
                    "✅ Login successful"
                );

                console.log(
                    "Firebase UID:",
                    user.uid
                );

                console.log(
                    "Firebase email:",
                    user.email
                );


                showToast(
                    "Login successful! Redirecting...",
                    true
                );


                /*
                    Check if the user originally tried
                    to access admin-orders.html.

                    If not, go to product.html.
                */

                const returnPage =
                    sessionStorage.getItem("returnAfterLogin");


                sessionStorage.removeItem(
                    "returnAfterLogin"
                );


                setTimeout(() => {

                    if (returnPage) {

                        window.location.href =
                            returnPage;

                    } else {

                        window.location.href =
                            "product.html";

                    }

                }, 700);

            })

            .catch((error) => {

                console.error(
                    "❌ Firebase Login Error:",
                    error
                );


                let message =
                    "Invalid email or password.";


                switch (error.code) {

                    case "auth/user-not-found":

                        message =
                            "No account found with this email.";

                        break;


                    case "auth/wrong-password":

                        message =
                            "Incorrect password.";

                        break;


                    case "auth/invalid-credential":

                        message =
                            "Incorrect email or password.";

                        break;


                    case "auth/invalid-email":

                        message =
                            "Please enter a valid email address.";

                        break;


                    case "auth/too-many-requests":

                        message =
                            "Too many failed attempts. Please try again later.";

                        break;


                    case "auth/network-request-failed":

                        message =
                            "Network error. Check your internet connection.";

                        break;

                }


                errorMsg.textContent =
                    message;

                errorMsg.classList.add('show');


                btn.innerHTML =
                    '<i class="fas fa-sign-in-alt"></i> Login';

                btn.disabled = false;

            });
    }


    // ==============================
    // AUTH STATE CHECK
    // ==============================

    firebase.auth().onAuthStateChanged((user) => {

        if (user) {

            console.log(
                "🟢 Firebase user is signed in:"
            );

            console.log(
                "UID:",
                user.uid
            );

            console.log(
                "Email:",
                user.email
            );

        } else {

            console.log(
                "🔴 No Firebase user is currently signed in."
            );

        }

    });


    console.log(
        "✅ Login page loaded."
    );

</script>
</body>
</html>
